<p>ብጹዕ አቡነ ፋኑኤል የአሜሪካ ዲሲ እና አከባቢው ሀገረ ስብከት ሊቀጳጳስ እማማ ዘውዲቱ እና ልጆቻቸውን ጎበኙ። በጉብኝታቸው ወቅት በሳቸው የበላይ ጠባቂነት የተቋቋመው የቅዱስ ዮሀንስ በጎ አድራጎት ማህበር የእስፖንሰርሺፕ ድጋፍ ከማበርከታቸውም በላይ ጸሎተ ብራኬ ሰጥተው ወደፊት ከእማማ ዘውዲቱ እና ከልጆቻቸው እንደማይሉ ቃል በመግባት አበረታተዋል።<br />
***<br />
ብጹዕነትዎ ረጅም ዕድሜ ከጤና ጋር ይስጥልን</p>
