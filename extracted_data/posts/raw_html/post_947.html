<p>የእማማ ዘውዲቱ ድርጅት ጥቅምት 6/2015 ዓ.ም በድርጅቱ ውስጥ ያደጉ አራት ልጆችን አስመረቀ በዕለቱ ከተለያዩ ተቋማት የተመረቁት ተማሪዎች 2 በማስተርስ 2 ደግሞ በዲፕሎማ የተመረቁ ናቸው ተማሪዎቹ በምረቃቸው ወቅት ለእዚህ ክብር ያበቃቸውን የእማማ ዘውዲቱ እና የድርጅቱን ድካም አቅም በፈቀደ ሁሉ ለመመለስና ሀገራቸው በመጥቀም ብድራቸውን ለመመለስ እንደሚተጉ ተናግረዋል።</p>
