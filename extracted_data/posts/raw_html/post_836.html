ለዘውዲቱ መሸሻ የህጻናት ማሳደጊያ እስታፍ የቢሮ ሰራተኞች መጀመሪያ ደረጃ እርዳታ(First Aid) አሰጣል ስልጠና በብሉ እልዝ ካምፓኒ(blue health company) በድርጅቱ ቅጥር ግቢ ውስጥ ታህሳስ 15/2014 ዓ.ም ተሰጠ<br />
ስልጠናው ህጻናቱ በግቢ ውስጥ ድንገት ሲታመሙ ወደ ህክምና ተቋማት እስኪደርሱ ድረስ መሰጠት ስላለበት እርዳታ ግንዛቤ እንዲያገኙ ተደርጓል።</p>
