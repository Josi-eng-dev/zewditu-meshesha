<p>///<br />
እናት ባንክ ዛሬ በእማማ ዘውዲቱ ሥም የከፈተውን ካራ ቅርንጫፍ እማማ ዘውዲቱ እና የባንኩ ከፍተኛ የሥራ አላፊዎች በተገኙበት አስመርቋል።<br />
የባንኩ ሥራ አስኪያጅ ወ/ሮ ገነት ሥራ ስያስጀምሩ እንደተናገሩት በወ/ሮ ዘውዲቱ ይህ ብራንች መከፈቱ ክብር እንደሚሰማቸው ገልጸው ወደፊትም አብሮ ለመስራት ትልቅ ፍላጎት እንዳላቸው ገልጸዋል</p>
<p>ክብር ለሚገባው ክብር ሰጥቷልና እናት ባንክን እናመሰግናለን<br />
ማን እንደእናት</p>
